<script src="{{ '/assets/js/main.min.js' | relative_url }}"></script>

{% include analytics.html %}
{% include fetch_google_scholar_stats.html %}

<script>
(function() {
  var canvas = document.getElementById('grass-canvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) return;

  var pixelRatio = 1;

  function resize() {
    pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(window.innerWidth * pixelRatio);
    canvas.height = Math.round(window.innerHeight * pixelRatio);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var blades = [];
  var previousPoint = null;
  var carriedDistance = 0;
  var bladeSpacing = 10;
  var maxBlades = 160;

  var greens = [
    'rgb(120, 178, 104)',
    'rgb(144, 190, 109)',
    'rgb(151, 202, 153)',
    'rgb(120, 190, 163)',
    'rgb(177, 211, 150)'
  ];

  function addBlade(x, y, vx, vy, speed) {
    var normalX = -vy / speed;
    var normalY = vx / speed;
    var sideOffset = (Math.random() - 0.5) * 14;
    var length = 15 + Math.min(speed, 32) * 0.2 + Math.random() * 9;

    blades.push({
      x: x + normalX * sideOffset,
      y: y + normalY * sideOffset,
      angle: Math.atan2(-vy, -vx) + (Math.random() - 0.5) * 0.42,
      length: length,
      width: 0.85 + Math.random() * 0.85,
      curve: (Math.random() - 0.5) * length * 0.44,
      fan: (Math.random() < 0.5 ? -1 : 1) * (0.2 + Math.random() * 0.14),
      life: 1,
      decay: 0.012 + Math.random() * 0.006,
      sway: (Math.random() - 0.5) * 0.005,
      color: greens[Math.floor(Math.random() * greens.length)]
    });

    if (blades.length > maxBlades) {
      blades.splice(0, blades.length - maxBlades);
    }
  }

  document.addEventListener('pointermove', function(e) {
    if (e.pointerType && e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;

    if (!previousPoint) {
      previousPoint = { x: e.clientX, y: e.clientY };
      return;
    }

    var vx = e.clientX - previousPoint.x;
    var vy = e.clientY - previousPoint.y;
    var distance = Math.sqrt(vx * vx + vy * vy);
    if (distance < 0.5) return;

    var availableDistance = carriedDistance + distance;
    var desiredCount = Math.floor(availableDistance / bladeSpacing);
    var count = Math.min(desiredCount, 8);
    var firstDistance = bladeSpacing - carriedDistance;

    for (var i = 0; i < count; i++) {
      var distanceAlongPath = desiredCount > 8
        ? distance * (i + 1) / count
        : firstDistance + i * bladeSpacing;
      var progress = Math.min(distanceAlongPath / distance, 1);
      addBlade(
        previousPoint.x + vx * progress,
        previousPoint.y + vy * progress,
        vx,
        vy,
        distance
      );
    }

    carriedDistance = desiredCount > 8 ? 0 : availableDistance - desiredCount * bladeSpacing;
    previousPoint = { x: e.clientX, y: e.clientY };
  });

  document.addEventListener('pointerleave', function() {
    previousPoint = null;
    carriedDistance = 0;
  });

  function draw() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    for (var i = blades.length - 1; i >= 0; i--) {
      var b = blades[i];
      b.life -= b.decay;
      b.angle += b.sway * b.life;

      if (b.life <= 0) {
        blades.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.angle);
      ctx.globalAlpha = Math.pow(b.life, 1.6) * 0.62;
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(
        b.length * 0.32, b.curve,
        b.length * 0.72, b.curve * 0.55,
        b.length, 0
      );
      ctx.bezierCurveTo(
        b.length * 0.68, b.curve * 0.3,
        b.length * 0.24, b.width,
        0, 0
      );
      ctx.closePath();
      ctx.fill();

      ctx.rotate(b.fan);
      ctx.globalAlpha = Math.pow(b.life, 1.6) * 0.38;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(
        b.length * 0.35, -b.curve * 0.45,
        b.length * 0.7, 0
      );
      ctx.quadraticCurveTo(
        b.length * 0.32, b.width * 0.65,
        0, 0
      );
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(draw);
  }

  draw();
})();
</script>
